<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSQ-L3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2733; --ink-soft:#4b5563; --paper:#f6f5f1; --card:#ffffff; --line:#e2e0d8;
    --indigo:#2f3e5c; --indigo-deep:#20293c; --sage:#6b8f71; --clay:#b8623f; --amber:#c99a3f;
    --radius:10px;
    --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --arabic:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
    --lang-h:44px;
    --sticky-h:92px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
  html[dir="rtl"] body{font-family:var(--arabic);}
  html[dir="rtl"] button, html[dir="rtl"] input{font-family:var(--arabic);}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 60px;}

  #langSwitch{position:sticky;top:0;z-index:40;height:var(--lang-h);background:var(--indigo-deep);
    display:flex;justify-content:center;align-items:center;gap:6px;padding:0 8px;}
  #langSwitch button{background:rgba(255,255,255,.08);color:#dfe3ec;border:1px solid rgba(255,255,255,.18);
    padding:6px 16px;border-radius:20px;font-size:.82rem;cursor:pointer;font-weight:600;font-family:inherit;}
  #langSwitch button.active{background:var(--sage);color:#12241a;border-color:var(--sage);}

  header.hero{background:linear-gradient(180deg,var(--indigo-deep) 0%,var(--indigo) 100%);color:#eef0f4;
    padding:36px 20px;text-align:center;border-bottom:4px solid var(--amber);}
  header.hero .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:#c9d1e0;margin-bottom:10px;font-weight:600;}
  html[dir="rtl"] header.hero .eyebrow{letter-spacing:0;text-transform:none;}
  header.hero h1{font-family:var(--serif);font-weight:600;font-size:1.8rem;margin:0 0 10px;}
  html[dir="rtl"] header.hero h1{font-family:var(--arabic);font-weight:700;}
  header.hero p{max-width:560px;margin:0 auto;color:#dfe3ec;font-size:.92rem;}
  header.hero .cabinet{display:inline-block;margin-top:18px;padding:8px 16px;border:1px solid rgba(255,255,255,.28);
    border-radius:24px;font-size:.85rem;color:#eef0f4;background:rgba(255,255,255,.06);}
  header.hero .cabinet b{color:#fff;}

  /* Barre de progression compacte, collée sous le sélecteur de langue */
  #progress-bar-outer{position:sticky;top:var(--lang-h);z-index:30;background:var(--paper);padding:8px 0 6px;
    border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(20,20,30,.05);}
  #progress-bar-outer .inner-wrap{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;}
  .progress-track{flex:1;height:8px;background:#e5e3da;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--sage);width:0%;transition:width .2s ease;}
  .progress-label{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;direction:ltr;}

  /* Légende 1–6 toujours visible en haut de l'écran pendant tout le défilement */
  #progress-bar-outer .scale-wrap{padding-top:6px;}
  .scale-sticky{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;direction:ltr;width:100%;}
  .scale-sticky .chip{background:#fbfaf7;border:1px solid var(--line);border-radius:6px;padding:3px 1px;text-align:center;min-width:0;}
  .scale-sticky .chip b{display:block;color:var(--indigo);font-size:.9rem;line-height:1.1;}
  .scale-sticky .chip span{display:block;font-size:.56rem;line-height:1.1;color:var(--ink-soft);margin-top:1px;overflow-wrap:anywhere;}
  @media (min-width:640px){ .scale-sticky .chip span{font-size:.7rem;} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:20px 0;box-shadow:0 1px 2px rgba(20,20,30,.04);}
  .instructions h2{font-family:var(--serif);font-size:1.2rem;margin-top:0;}
  html[dir="rtl"] .instructions h2, html[dir="rtl"] #txt-results-title{font-family:var(--arabic);}
  .scale-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px;font-size:.85rem;}
  .scale-legend div{background:#f1f0ea;border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  .scale-legend b{color:var(--indigo);display:block;font-size:.8rem;}

  .id-fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .id-label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--ink-soft);}
  .id-label input{font-family:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfaf7;color:var(--ink);}
  .id-label input:focus,.id-label textarea:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  .id-label textarea{font-family:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfaf7;color:var(--ink);resize:vertical;}
  .id-label .invalid, .id-label input.invalid, .id-label textarea.invalid{border-color:var(--clay);background:#fdf3ee;}

  .schema-block{margin:26px 0;}
  .schema-title{font-family:var(--serif);font-size:1.05rem;color:var(--indigo);border-bottom:2px solid var(--line);
    padding-bottom:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  html[dir="rtl"] .schema-title{font-family:var(--arabic);font-weight:700;}
  .schema-title .code{font-family:var(--sans);font-size:.72rem;background:var(--indigo);color:#fff;padding:2px 8px;border-radius:20px;letter-spacing:.05em;white-space:nowrap;}

  /* Chaque item est autonome : énoncé + 6 choix toujours visibles dans la même carte */
  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;
    scroll-margin-top:calc(var(--lang-h) + var(--sticky-h) + 8px);transition:border-color .15s ease,background .15s ease;}
  .q.answered{border-color:#c9d8cc;}
  .q.missing{border-color:var(--clay);background:#fdf3ee;}
  .q-text{font-size:.97rem;margin-bottom:12px;}
  .q-num{color:var(--clay);font-weight:700;margin-inline-end:6px;}
  .q-options{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr;}
  .q-options label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:48px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 2px;
    font-size:1rem;font-weight:600;color:var(--ink-soft);background:#fbfaf7;transition:all .12s ease;
    -webkit-tap-highlight-color:transparent;user-select:none;}
  .q-options label small{display:block;font-size:.58rem;font-weight:400;line-height:1.1;margin-top:3px;text-align:center;overflow-wrap:anywhere;}
  .q-options input{position:absolute;opacity:0;width:1px;height:1px;margin:0;}
  .q-options label:hover{border-color:var(--indigo);}
  .q-options label:has(input:checked){background:var(--indigo);border-color:var(--indigo);color:#fff;}
  .q-options label:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:2px;}
  .q-options label{min-height:58px;}
  @media (min-width:640px){ .q-options label small{font-size:.7rem;} .q-options label{min-height:62px;} }

  .consent{font-size:.8rem;color:var(--ink-soft);text-align:center;max-width:560px;margin:0 auto 14px;}
  .submit-zone{text-align:center;margin:36px 0 10px;}
  button.primary{background:var(--indigo);color:#fff;border:none;padding:14px 34px;border-radius:30px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--indigo-deep);}
  button.primary:disabled{opacity:.6;cursor:not-allowed;}
  button.ghost{background:transparent;color:var(--indigo);border:1px solid var(--indigo);padding:10px 22px;border-radius:30px;font-size:.88rem;cursor:pointer;margin-top:10px;font-family:inherit;text-decoration:none;display:inline-block;}
  .missing-note{color:var(--clay);font-size:.88rem;margin:10px 0;min-height:1.2em;}

  #results{display:none;}
  .disclaimer{font-size:.8rem;color:var(--ink-soft);background:#f1f0ea;border-radius:8px;padding:14px 16px;margin-top:24px;}
  .send-status{margin-top:12px;font-size:.9rem;min-height:1.2em;}
  .send-status.ok{color:#3d6b45;font-weight:600;}
  .send-status.err{color:var(--clay);font-weight:600;}
  .send-status.pending{color:var(--ink-soft);}
  .send-detail{font-size:.72rem;color:var(--ink-soft);margin-top:6px;word-break:break-word;}
  #fallbackZone{display:none;margin-top:8px;}
  footer{text-align:center;font-size:.78rem;color:var(--ink-soft);padding:30px 0;}
</style>
</head>
<body>

<div id="langSwitch">
  <button type="button" data-lang="fr">Français</button>
  <button type="button" data-lang="en">English</button>
  <button type="button" data-lang="ar">العربية</button>
</div>

<header class="hero">
  <div class="eyebrow" id="txt-eyebrow"></div>
  <h1 id="txt-title"></h1>
  <p id="txt-subtitle"></p>
  <div class="cabinet" id="txt-cabinet"></div>
</header>

<div id="progress-bar-outer" style="display:none;">
  <div class="inner-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <div class="inner-wrap scale-wrap">
    <div class="scale-sticky" id="scaleSticky" aria-hidden="true"></div>
  </div>
</div>

<div class="wrap">
  <div class="card instructions">
    <h2 id="txt-instructions-h2"></h2>
    <p id="txt-instructions-p"></p>
    <div class="scale-legend" id="scaleLegend"></div>
  </div>

  <!-- Fiche d'identification : obligatoire avant d'accéder aux questions -->
  <div class="card" id="idCard">
    <h2 id="txt-id-title" style="font-family:var(--serif);font-size:1.2rem;margin-top:0;"></h2>
    <p id="txt-id-intro" style="font-size:.9rem;color:var(--ink-soft);margin-top:0;"></p>
    <div class="id-fields">
      <label class="id-label"><span id="lbl-last"></span>
        <input type="text" id="patientLast" autocomplete="family-name"></label>
      <label class="id-label"><span id="lbl-first"></span>
        <input type="text" id="patientFirst" autocomplete="given-name"></label>
      <label class="id-label"><span id="lbl-birth"></span>
        <input type="date" id="patientBirth" dir="ltr" min="1900-01-01" autocomplete="bday"></label>
      <label class="id-label"><span id="lbl-patient-email"></span>
        <input type="email" id="patientEmail" dir="ltr" autocomplete="email" inputmode="email" placeholder="exemple@email.com"></label>
    </div>
    <label class="id-label" style="margin-top:12px;"><span id="lbl-reason"></span>
      <textarea id="patientReason" rows="3" maxlength="600"></textarea></label>
    <div class="missing-note" id="idNote" role="alert"></div>
    <div style="text-align:center;margin-top:8px;"><button type="button" class="primary" id="startBtn"></button></div>
  </div>

  <div id="quizArea" style="display:none;">
  <form id="quizForm" onsubmit="return false;"></form>

  <div class="submit-zone">
    <div class="consent" id="txt-consent"></div>
    <div class="missing-note" id="missingNote"></div>
    <button type="button" class="ghost" id="jumpBtn" style="display:none;margin-bottom:14px;"></button><br>
    <button type="button" class="primary" id="computeBtn"></button>
  </div>

  <div id="results" class="card">
    <h2 style="font-family:var(--serif);margin-top:0;" id="txt-results-title"></h2>
    <div id="sendStatus" class="send-status" role="status" aria-live="polite"></div>
    <div id="sendDetail" class="send-detail" dir="ltr"></div>
    <div id="fallbackZone">
      <button type="button" class="ghost" id="retryBtn"></button>
      <a class="ghost" id="mailtoBtn" href="#"></a>
    </div>
    <div style="text-align:center;"><button type="button" class="ghost" id="restartBtn"></button></div>
  </div>
  </div><!-- /quizArea -->
</div>

<footer id="txt-footer"></footer>

<script>
const ITEMS = [{"n": 1, "s": "ED", "fr": "Les autres n’ont pas satisfait mes besoins affectifs.", "en": "Others have not met my emotional needs.", "ar": "لم يُلبِّ الآخرون احتياجاتي العاطفية."}, {"n": 2, "s": "ED", "fr": "Je n'ai pas reçu suffisamment d’amour et d’attention.", "en": "I haven't received enough love and attention.", "ar": "لم أحصل على ما يكفي من الحب والاهتمام."}, {"n": 3, "s": "ED", "fr": "Dans l’ensemble, je n’ai eu personne sur qui compter pour recevoir des conseils ou du soutien affectif.", "en": "On the whole, I haven't had anyone to rely on for advice or emotional support.", "ar": "بشكل عام، لم يكن لدي من أعتمد عليه للحصول على النصح أو الدعم العاطفي."}, {"n": 4, "s": "ED", "fr": "La plupart du temps, je n'ai eu personne pour m'aider à grandir, pour partager son univers intérieur avec moi, ou qui se soucie profondément de tout ce qui m'arrive.", "en": "Most of the time, I haven't had anyone to help me grow, to share their inner world with me, or who deeply cares about everything that happens to me.", "ar": "في معظم الأحيان، لم يكن لدي من يساعدني على النمو، أو يشاركني عالمه الداخلي، أو يهتم فعلاً بكل ما يحدث لي."}, {"n": 5, "s": "ED", "fr": "Pour la plus grande partie de ma vie, je n'ai eu personne qui veuille être près de moi et passer beaucoup de temps avec moi.", "en": "For most of my life, I haven't had anyone who wanted to be close to me and spend a lot of time with me.", "ar": "طوال معظم حياتي، لم يكن لدي من يرغب في التقرب مني وقضاء وقت طويل معي."}, {"n": 6, "s": "ED", "fr": "En général, les autres n'ont pas été présents pour me prendre dans leurs bras, pour me donner de la chaleur et de l'affection.", "en": "In general, others haven't been there to hold me, to give me warmth and affection.", "ar": "بشكل عام، لم يكن الآخرون حاضرين لاحتضاني ومنحي الدفء والمودة."}, {"n": 7, "s": "ED", "fr": "Pour la plus grande partie de ma vie, je n’ai jamais eu le sentiment que je représentais quelqu’un d’important pour quelqu’un d’autre.", "en": "For most of my life, I have never felt that I was important to someone else.", "ar": "طوال معظم حياتي، لم أشعر يومًا بأنني أمثل شخصًا مهمًا بالنسبة لأحد."}, {"n": 8, "s": "ED", "fr": "En grande partie, je n'ai eu personne qui m'écoute réellement, me comprenne et soit sensible à mes besoins et mes sentiments véritables.", "en": "For the most part, I haven't had anyone who really listens to me, understands me, and is sensitive to my true needs and feelings.", "ar": "في معظم الأحيان، لم يكن لدي من يستمع إلي حقًا، ويفهمني، ويتفهم احتياجاتي ومشاعري الحقيقية."}, {"n": 9, "s": "ED", "fr": "J’ai rarement eu une personne forte pour me donner de bons conseils ou pour me guider lorsque je ne savais pas quoi faire.", "en": "I have rarely had a strong person to give me good advice or guide me when I didn't know what to do.", "ar": "نادرًا ما كان لدي شخص قوي يقدم لي نصائح جيدة أو يرشدني عندما لا أعرف ماذا أفعل."}, {"n": 10, "s": "AB", "fr": "Je suis préoccupé(e) par le fait que les gens que j'aime vont mourir bientôt même s'il y a peu de raisons médicales à ma préoccupation.", "en": "I worry that people I love will die soon, even though there is little medical reason for my concern.", "ar": "أنا قلق من أن الأشخاص الذين أحبهم سيموتون قريبًا، حتى لو لم يكن هناك سبب طبي وجيه لقلقي."}, {"n": 11, "s": "AB", "fr": "Je m’accroche aux gens dont je suis proche par peur qu’ils ne me quittent.", "en": "I cling to people I'm close to for fear that they will leave me.", "ar": "أتشبث بالأشخاص المقربين مني خوفًا من أن يتركوني."}, {"n": 12, "s": "AB", "fr": "Je crains que les gens dont je me sens proche ne me quittent ou ne m’abandonnent.", "en": "I fear that people I feel close to will leave or abandon me.", "ar": "أخشى أن يتركني أو يهجرني من أشعر بالقرب منهم."}, {"n": 13, "s": "AB", "fr": "J'ai le sentiment de manquer d'une base stable qui me soutienne affectivement.", "en": "I feel I lack a stable base that supports me emotionally.", "ar": "أشعر أنني أفتقر إلى قاعدة مستقرة تدعمني عاطفيًا."}, {"n": 14, "s": "AB", "fr": "Je n'ai pas l’impression que les relations importantes dureront : je m'attends à ce qu'elles finissent.", "en": "I don't feel that important relationships will last: I expect them to end.", "ar": "لا أشعر بأن العلاقات المهمة ستدوم: أتوقع أن تنتهي."}, {"n": 15, "s": "AB", "fr": "Je me sens \"accro\" aux partenaires qui ne peuvent pas s'engager avec moi de façon stable.", "en": "I feel 'hooked' on partners who cannot commit to me in a stable way.", "ar": "أشعر بأنني \"مدمن\" على شركاء غير قادرين على الالتزام معي بشكل مستقر."}, {"n": 16, "s": "AB", "fr": "Je finirai seul(e).", "en": "I will end up alone.", "ar": "سأنتهي وحيدًا."}, {"n": 17, "s": "AB", "fr": "Quand je sens que quelqu’un à qui je tiens s’éloigne de moi, je deviens désespéré.", "en": "When I feel that someone I care about is pulling away from me, I become desperate.", "ar": "عندما أشعر بأن شخصًا أهتم به يبتعد عني، أصاب باليأس."}, {"n": 18, "s": "AB", "fr": "Quelquefois j’ai tellement peur que les gens m’abandonnent que je les repousse.", "en": "Sometimes I am so afraid that people will abandon me that I push them away.", "ar": "أحيانًا أخاف كثيرًا من أن يتخلى عني الناس لدرجة أنني أنفرهم بنفسي."}, {"n": 19, "s": "AB", "fr": "Je deviens bouleversé(e) quand quelqu’un me laisse seul(e) même pour une courte période.", "en": "I become upset when someone leaves me alone even for a short period.", "ar": "أشعر بالانزعاج الشديد عندما يتركني أحدهم وحيدًا حتى لفترة قصيرة."}, {"n": 20, "s": "AB", "fr": "Je ne peux compter sur la présence régulière de ceux qui me soutiennent.", "en": "I cannot count on the steady presence of those who support me.", "ar": "لا يمكنني الاعتماد على الحضور المنتظم لمن يدعمونني."}, {"n": 21, "s": "AB", "fr": "Je ne peux me permettre d’être vraiment proche des autres car je ne peux être sûr(e) qu’ils seront toujours là.", "en": "I cannot allow myself to be truly close to others because I can't be sure they will always be there.", "ar": "لا أستطيع السماح لنفسي بالتقرب حقًا من الآخرين لأنني لا أستطيع التأكد من أنهم سيبقون دائمًا."}, {"n": 22, "s": "AB", "fr": "Il me semble que les personnes importantes dans ma vie sont toujours en train de venir et de repartir.", "en": "It seems to me that the important people in my life are always coming and going.", "ar": "يبدو لي أن الأشخاص المهمين في حياتي دائمًا ما يأتون ويرحلون."}, {"n": 23, "s": "AB", "fr": "J’ai très peur que les personnes que j'aime ne trouvent quelqu'un d'autre qu'elles préfèrent et qu'elles m'abandonnent.", "en": "I am very afraid that the people I love will find someone else they prefer and abandon me.", "ar": "أخشى بشدة أن يجد من أحبهم شخصًا آخر يفضلونه ويتخلوا عني."}, {"n": 24, "s": "AB", "fr": "Les gens qui me sont proches ont toujours été très imprévisibles : un moment ils sont disponibles et gentils, puis, ils sont fâchés, contrariés, querelleurs, préoccupés par eux-mêmes…", "en": "People close to me have always been very unpredictable: one moment they are available and kind, then they are angry, upset, argumentative, self-absorbed…", "ar": "الأشخاص المقربون مني كانوا دائمًا غير متوقعين: في لحظة يكونون متاحين ولطفاء، ثم يصبحون غاضبين، منزعجين، جدليين، منشغلين بأنفسهم…"}, {"n": 25, "s": "AB", "fr": "J'ai tellement besoin des autres que j’ai peur de les perdre.", "en": "I need others so much that I am afraid of losing them.", "ar": "أحتاج إلى الآخرين بشدة لدرجة أنني أخشى فقدانهم."}, {"n": 26, "s": "AB", "fr": "Je ne peux être moi-même ou exprimer ce que je ressens véritablement, sinon les autres vont me quitter.", "en": "I cannot be myself or express what I truly feel, otherwise others will leave me.", "ar": "لا أستطيع أن أكون على طبيعتي أو أعبر عما أشعر به حقًا، وإلا سيتركني الآخرون."}, {"n": 27, "s": "MA", "fr": "J’ai l’impression que les autres vont profiter de moi.", "en": "I feel that others will take advantage of me.", "ar": "أشعر بأن الآخرين سيستغلونني."}, {"n": 28, "s": "MA", "fr": "J’ai souvent l’impression que je dois me protéger des autres.", "en": "I often feel I must protect myself from others.", "ar": "غالبًا ما أشعر بأنني يجب أن أحمي نفسي من الآخرين."}, {"n": 29, "s": "MA", "fr": "J’ai l’impression que je dois être sur mes gardes en présence des autres sinon ils me blesseront intentionnellement.", "en": "I feel I must be on my guard around others or they will intentionally hurt me.", "ar": "أشعر بأنه يجب أن أكون حذرًا بوجود الآخرين وإلا سيؤذونني عمدًا."}, {"n": 30, "s": "MA", "fr": "Si une personne est aimable avec moi, je suppose qu’elle cherche à obtenir quelque chose.", "en": "If someone is nice to me, I assume they want something from me.", "ar": "إذا كان شخص ما لطيفًا معي، أفترض أنه يسعى للحصول على شيء ما."}, {"n": 31, "s": "MA", "fr": "Ce n’est qu’une question de temps avant que quelqu’un me trahisse.", "en": "It's only a matter of time before someone betrays me.", "ar": "إنها مسألة وقت فقط قبل أن يخونني أحدهم."}, {"n": 32, "s": "MA", "fr": "La plupart des gens pensent uniquement à eux.", "en": "Most people only think about themselves.", "ar": "معظم الناس يفكرون في أنفسهم فقط."}, {"n": 33, "s": "MA", "fr": "J'ai la plus grande difficulté à faire confiance aux autres.", "en": "I have great difficulty trusting others.", "ar": "أواجه صعوبة كبيرة في الوثوق بالآخرين."}, {"n": 34, "s": "MA", "fr": "Je suis très méfiant quant aux motivations des autres.", "en": "I am very suspicious of others' motives.", "ar": "أنا شديد الشك في دوافع الآخرين."}, {"n": 35, "s": "MA", "fr": "Les autres sont rarement honnêtes, ils ne sont pas en général ce qu'ils paraissent.", "en": "Others are rarely honest; they are generally not what they appear to be.", "ar": "نادرًا ما يكون الآخرون صادقين؛ فهم عمومًا ليسوا كما يبدون."}, {"n": 36, "s": "MA", "fr": "Je m’interroge habituellement sur les véritables intentions des autres.", "en": "I usually wonder about others' true intentions.", "ar": "عادةً ما أتساءل عن النوايا الحقيقية للآخرين."}, {"n": 37, "s": "MA", "fr": "Si je pense que quelqu’un cherche à me blesser, je cherche à le blesser en premier.", "en": "If I think someone is trying to hurt me, I try to hurt them first.", "ar": "إذا اعتقدت أن شخصًا ما يحاول إيذائي، أحاول إيذاءه أولًا."}, {"n": 38, "s": "MA", "fr": "Les autres habituellement doivent faire leurs preuves avant que je leur accorde ma confiance.", "en": "Others usually have to prove themselves before I give them my trust.", "ar": "عادةً ما يجب على الآخرين إثبات أنفسهم قبل أن أمنحهم ثقتي."}, {"n": 39, "s": "MA", "fr": "Je teste les autres pour voir s'ils me disent la vérité ou s’ils sont bien intentionnés.", "en": "I test others to see if they are telling me the truth or are well-intentioned.", "ar": "أختبر الآخرين لأرى إن كانوا يقولون لي الحقيقة أو حسني النية."}, {"n": 40, "s": "MA", "fr": "Je souscris à la croyance : «Contrôle ou tu seras contrôlé(e).»", "en": "I subscribe to the belief: 'Control or be controlled.'", "ar": "أؤمن بمقولة: \"تحكّم وإلا سيتحكم بك الآخرون.\""}, {"n": 41, "s": "MA", "fr": "Je me mets en colère quand je pense aux façons dont j’ai été maltraité par les autres tout au long de ma vie.", "en": "I get angry when I think about the ways I have been mistreated by others throughout my life.", "ar": "أغضب عندما أفكر في الطرق التي أُسيء بها معاملتي من قبل الآخرين طوال حياتي."}, {"n": 42, "s": "MA", "fr": "Tout au long de ma vie, mes proches ont profité de moi et m’ont utilisé à leurs propres desseins.", "en": "Throughout my life, people close to me have taken advantage of me and used me for their own purposes.", "ar": "طوال حياتي، استغلني المقربون مني واستخدموني لتحقيق أغراضهم الخاصة."}, {"n": 43, "s": "MA", "fr": "J’ai été physiquement, émotionnellement, ou sexuellement abusé(e) par des personnes importantes de ma vie.", "en": "I have been physically, emotionally, or sexually abused by important people in my life.", "ar": "تعرضت للإساءة الجسدية أو العاطفية أو الجنسية من قبل أشخاص مهمين في حياتي."}, {"n": 44, "s": "SI", "fr": "Je ne suis pas adapté(e).", "en": "I don't fit in.", "ar": "لا أنسجم مع الآخرين."}, {"n": 45, "s": "SI", "fr": "Je suis fondamentalement différent(e) des autres.", "en": "I am fundamentally different from others.", "ar": "أنا مختلف جوهريًا عن الآخرين."}, {"n": 46, "s": "SI", "fr": "Je suis à part; je suis un(e) solitaire.", "en": "I am set apart; I am a loner.", "ar": "أنا منعزل؛ أنا شخص وحيد."}, {"n": 47, "s": "SI", "fr": "Je me sens étranger(ère) aux autres.", "en": "I feel like a stranger to others.", "ar": "أشعر بأنني غريب عن الآخرين."}, {"n": 48, "s": "SI", "fr": "Je me sens isolé(e) et seul(e).", "en": "I feel isolated and alone.", "ar": "أشعر بالعزلة والوحدة."}, {"n": 49, "s": "SI", "fr": "Je me sens toujours à l’extérieur des groupes.", "en": "I always feel outside of groups.", "ar": "أشعر دائمًا بأنني خارج المجموعات."}, {"n": 50, "s": "SI", "fr": "Personne ne me comprend vraiment.", "en": "No one really understands me.", "ar": "لا أحد يفهمني حقًا."}, {"n": 51, "s": "SI", "fr": "Ma famille a toujours été différente des autres familles.", "en": "My family has always been different from other families.", "ar": "كانت عائلتي دائمًا مختلفة عن العائلات الأخرى."}, {"n": 52, "s": "SI", "fr": "J’ai parfois le sentiment d’être un étranger.", "en": "I sometimes feel like an outsider.", "ar": "أشعر أحيانًا بأنني غريب."}, {"n": 53, "s": "SI", "fr": "Si je disparaissais demain, personne ne le remarquerait.", "en": "If I disappeared tomorrow, no one would notice.", "ar": "لو اختفيت غدًا، لن يلاحظ أحد ذلك."}, {"n": 54, "s": "DS", "fr": "Aucun homme ou femme que je désire ne pourrait m'aimer une fois qu'il(elle) aurait vu mes défauts.", "en": "No man or woman I desire could love me once they saw my flaws.", "ar": "لا يمكن لأي رجل أو امرأة أرغب فيهما أن يحبني بعد أن يرى عيوبي."}, {"n": 55, "s": "DS", "fr": "Aucune personne que je désire ne pourrait rester proche de moi si elle savait qui je suis réellement.", "en": "No person I desire could stay close to me if they knew who I really am.", "ar": "لا يمكن لأي شخص أرغب فيه أن يبقى قريبًا مني إذا عرف من أنا حقًا."}, {"n": 56, "s": "DS", "fr": "Je suis fondamentalement imparfait et marqué(e) par un défaut.", "en": "I am fundamentally flawed and marked by a defect.", "ar": "أنا ناقص جوهريًا ومعيب بشكل أساسي."}, {"n": 57, "s": "DS", "fr": "Même si je me donne le plus grand mal, je sens qu'il ne me sera pas possible d'obtenir le respect d'un homme ou d'une femme important(e) et de sentir que j'ai de la valeur.", "en": "Even if I try my hardest, I feel it won't be possible to gain the respect of an important man or woman and feel that I have worth.", "ar": "حتى لو بذلت قصارى جهدي، أشعر أنه لن يكون بإمكاني كسب احترام رجل أو امرأة مهمة والشعور بأن لي قيمة."}, {"n": 58, "s": "DS", "fr": "Je ne mérite pas l’amour, l’attention et le respect des autres.", "en": "I don't deserve the love, attention, and respect of others.", "ar": "لا أستحق حب واهتمام واحترام الآخرين."}, {"n": 59, "s": "DS", "fr": "J’ai le sentiment d’être quelqu’un que l’on ne peut pas aimer.", "en": "I feel like someone who cannot be loved.", "ar": "أشعر بأنني شخص لا يمكن أن يُحَب."}, {"n": 60, "s": "DS", "fr": "Je suis trop fondamentalement inacceptable pour me révéler aux autres.", "en": "I am too fundamentally unacceptable to reveal myself to others.", "ar": "أنا غير مقبول جوهريًا لدرجة أنني لا أستطيع الكشف عن نفسي للآخرين."}, {"n": 61, "s": "DS", "fr": "Je ne pourrais pas affronter les gens, s’ils découvraient mes défauts fondamentaux.", "en": "I couldn't face people if they discovered my fundamental flaws.", "ar": "لن أستطيع مواجهة الناس إذا اكتشفوا عيوبي الجوهرية."}, {"n": 62, "s": "DS", "fr": "Lorsque les gens m’apprécient, j’ai l’impression de les duper.", "en": "When people like me, I feel like I'm fooling them.", "ar": "عندما يعجب بي الناس، أشعر بأنني أخدعهم."}, {"n": 63, "s": "DS", "fr": "Je suis souvent attiré(e) par les gens qui sont très critiques envers moi ou qui me rejettent.", "en": "I am often attracted to people who are very critical of me or who reject me.", "ar": "غالبًا ما أنجذب إلى الأشخاص الذين ينتقدونني بشدة أو يرفضونني."}, {"n": 64, "s": "DS", "fr": "J’ai des secrets que je ne veux pas que mes proches découvrent.", "en": "I have secrets I don't want my loved ones to discover.", "ar": "لدي أسرار لا أريد أن يكتشفها المقربون مني."}, {"n": 65, "s": "DS", "fr": "C’est de ma faute si mes parents n’ont pas pu m’aimer suffisamment.", "en": "It's my fault that my parents couldn't love me enough.", "ar": "إنه خطئي أن والديّ لم يستطيعا أن يحباني بما فيه الكفاية."}, {"n": 66, "s": "DS", "fr": "Je ne laisse pas les gens connaître ce que je suis réellement.", "en": "I don't let people know who I really am.", "ar": "لا أدع الناس يعرفون من أنا حقًا."}, {"n": 67, "s": "DS", "fr": "Une de mes plus grandes peurs est que mes défauts deviennent publics.", "en": "One of my greatest fears is that my flaws will become public.", "ar": "أحد أكبر مخاوفي هو أن تصبح عيوبي معروفة للجميع."}, {"n": 68, "s": "DS", "fr": "Je ne puis comprendre comment qui que ce soit pourrait m'aimer.", "en": "I cannot understand how anyone could love me.", "ar": "لا يمكنني أن أفهم كيف يمكن لأي شخص أن يحبني."}, {"n": 69, "s": "FA", "fr": "Presque rien de ce que je fais au travail (ou à l'école) n'est aussi bon que ce que font les autres.", "en": "Almost nothing I do at work (or school) is as good as what others do.", "ar": "تقريبًا لا شيء مما أفعله في العمل (أو الدراسة) بجودة ما يفعله الآخرون."}, {"n": 70, "s": "FA", "fr": "Je suis incompétent(e) quand il s'agit de réussir.", "en": "I am incompetent when it comes to succeeding.", "ar": "أنا غير كفء عندما يتعلق الأمر بالنجاح."}, {"n": 71, "s": "FA", "fr": "La plupart des gens sont plus doués que moi en ce qui concerne le travail (ou l'école) et la réussite.", "en": "Most people are more capable than me when it comes to work (or school) and success.", "ar": "معظم الناس أكثر موهبة مني فيما يتعلق بالعمل (أو الدراسة) والنجاح."}, {"n": 72, "s": "FA", "fr": "Je suis un(e) raté(e).", "en": "I am a failure.", "ar": "أنا فاشل."}, {"n": 73, "s": "FA", "fr": "Je n’ai pas autant de talent que les autres au travail (ou à l’école).", "en": "I don't have as much talent as others at work (or school).", "ar": "لا أملك موهبة بقدر الآخرين في العمل (أو الدراسة)."}, {"n": 74, "s": "FA", "fr": "Je ne suis pas aussi intelligent(e) que la plupart des gens quand il s'agit du travail (ou de l'école).", "en": "I am not as smart as most people when it comes to work (or school).", "ar": "لست ذكيًا بقدر معظم الناس عندما يتعلق الأمر بالعمل (أو الدراسة)."}, {"n": 75, "s": "FA", "fr": "Je suis humilié(e) par mes échecs ou mes insuffisances dans le monde du travail(ou de l'école).", "en": "I am humiliated by my failures or shortcomings in the world of work (or school).", "ar": "أشعر بالإذلال بسبب إخفاقاتي أو أوجه قصوري في مجال العمل (أو الدراسة)."}, {"n": 76, "s": "FA", "fr": "Je suis souvent mal à l'aise avec les autres, car je ne les vaux pas en termes de réussites.", "en": "I am often uncomfortable with others because I don't measure up to them in terms of achievements.", "ar": "غالبًا ما أشعر بعدم الارتياح مع الآخرين لأنني لا أضاهيهم من حيث الإنجازات."}, {"n": 77, "s": "FA", "fr": "Je compare souvent mes réalisations à celles des autres et je trouve qu’ils réussissent beaucoup mieux.", "en": "I often compare my achievements to those of others and find that they do much better.", "ar": "غالبًا ما أقارن إنجازاتي بإنجازات الآخرين وأجد أنهم ينجحون بشكل أفضل بكثير."}, {"n": 78, "s": "DI", "fr": "Je ne me sens pas capable de me débrouiller par moi-même dans la vie de tous les jours.", "en": "I don't feel capable of managing on my own in everyday life.", "ar": "لا أشعر بأنني قادر على التدبر بمفردي في الحياة اليومية."}, {"n": 79, "s": "DI", "fr": "J’ai besoin des autres pour m’aider à m’en sortir.", "en": "I need others to help me get by.", "ar": "أحتاج إلى الآخرين لمساعدتي على التعايش."}, {"n": 80, "s": "DI", "fr": "Je n’ai pas le sentiment que je puisse bien m’adapter par moi-même.", "en": "I don't feel that I can cope well on my own.", "ar": "لا أشعر بأنني أستطيع التكيف جيدًا بمفردي."}, {"n": 81, "s": "DI", "fr": "Je crois que les autres peuvent prendre soin de moi mieux que je ne le peux moi-même.", "en": "I believe others can take care of me better than I can myself.", "ar": "أعتقد أن الآخرين يستطيعون الاعتناء بي أفضل مما أستطيع أنا."}, {"n": 82, "s": "DI", "fr": "J’ai des difficultés à prendre en charge de nouvelles tâches en dehors du travail à moins que quelqu'un ne me guide.", "en": "I have difficulty taking on new tasks outside of work unless someone guides me.", "ar": "أواجه صعوبة في تولي مهام جديدة خارج العمل ما لم يوجهني أحد."}, {"n": 83, "s": "DI", "fr": "Je me considère comme une personne dépendante en ce qui concerne la vie de tous les jours.", "en": "I consider myself a dependent person when it comes to everyday life.", "ar": "أعتبر نفسي شخصًا معتمدًا على الآخرين فيما يخص الحياة اليومية."}, {"n": 84, "s": "DI", "fr": "Je bousille tout ce que j’entreprends, même à l’extérieur du travail (ou de l’école).", "en": "I mess up everything I undertake, even outside of work (or school).", "ar": "أفسد كل ما أقوم به، حتى خارج العمل (أو الدراسة)."}, {"n": 85, "s": "DI", "fr": "Je suis stupide dans la plupart des domaines de la vie.", "en": "I am inept in most areas of life.", "ar": "أنا غبي في معظم مجالات الحياة."}, {"n": 86, "s": "DI", "fr": "Si je me fie à mon jugement dans la vie de tous les jours, je vais prendre la mauvaise décision.", "en": "If I rely on my own judgment in everyday life, I will make the wrong decision.", "ar": "إذا اعتمدت على حكمي الخاص في الحياة اليومية، سأتخذ القرار الخاطئ."}, {"n": 87, "s": "DI", "fr": "Je manque de bon sens.", "en": "I lack common sense.", "ar": "أفتقر إلى الحس السليم."}, {"n": 88, "s": "DI", "fr": "On ne peut se fier à mon jugement dans les situations quotidiennes.", "en": "My judgment cannot be trusted in everyday situations.", "ar": "لا يمكن الوثوق بحكمي في المواقف اليومية."}, {"n": 89, "s": "DI", "fr": "Je n'ai pas confiance dans ma capacité à résoudre les problèmes qui se posent tous les jours.", "en": "I don't trust my ability to solve everyday problems.", "ar": "لا أثق في قدرتي على حل المشكلات اليومية."}, {"n": 90, "s": "DI", "fr": "Je pense avoir besoin de quelqu’un sur qui je puisse compter pour me donner des conseils sur les questions pratiques.", "en": "I think I need someone I can rely on to give me advice on practical matters.", "ar": "أعتقد أنني بحاجة إلى شخص أعتمد عليه لتقديم النصح لي في الأمور العملية."}, {"n": 91, "s": "DI", "fr": "Je me sens plus un(e) enfant qu'un(e) adulte quand il s'agit de prendre en main les responsabilités quotidiennes.", "en": "I feel more like a child than an adult when it comes to handling daily responsibilities.", "ar": "أشعر بأنني أقرب إلى الطفل مني إلى البالغ عندما يتعلق الأمر بتحمل المسؤوليات اليومية."}, {"n": 92, "s": "DI", "fr": "Je me sens dépassé par les responsabilités de tous les jours.", "en": "I feel overwhelmed by everyday responsibilities.", "ar": "أشعر بأنني مثقل بالمسؤوليات اليومية."}, {"n": 93, "s": "VU", "fr": "Il ne me semble pas possible d’échapper au sentiment que quelque chose de mauvais va bientôt se passer.", "en": "It doesn't seem possible to escape the feeling that something bad is about to happen.", "ar": "لا يبدو ممكنًا التخلص من الشعور بأن شيئًا سيئًا سيحدث قريبًا."}, {"n": 94, "s": "VU", "fr": "J’ai l’impression qu’un désastre naturel, criminel, financier ou médical pourrait frapper à tout moment.", "en": "I feel that a natural, criminal, financial, or medical disaster could strike at any moment.", "ar": "أشعر بأن كارثة طبيعية أو إجرامية أو مالية أو طبية قد تحدث في أي لحظة."}, {"n": 95, "s": "VU", "fr": "J'ai peur de devenir un(e) sans domicile fixe ou un(e) mendiant(e).", "en": "I am afraid of becoming homeless or a beggar.", "ar": "أخشى أن أصبح بلا مأوى أو متسولًا."}, {"n": 96, "s": "VU", "fr": "J’ai peur d’être attaqué(e).", "en": "I am afraid of being attacked.", "ar": "أخشى أن أتعرض للاعتداء."}, {"n": 97, "s": "VU", "fr": "Je prends de grandes précautions pour éviter de tomber malade ou d’être blessé(e).", "en": "I take great precautions to avoid getting sick or being injured.", "ar": "أتخذ احتياطات كبيرة لتجنب المرض أو الإصابة."}, {"n": 98, "s": "VU", "fr": "J’ai peur d’avoir une maladie grave, même si rien de sérieux n’a été diagnostiqué par un médecin.", "en": "I am afraid of having a serious illness, even though nothing serious has been diagnosed by a doctor.", "ar": "أخشى الإصابة بمرض خطير، حتى لو لم يشخص الطبيب أي شيء خطير."}, {"n": 99, "s": "VU", "fr": "Je suis quelqu'un de peureux (se).", "en": "I am a fearful person.", "ar": "أنا شخص خائف بطبعي."}, {"n": 100, "s": "VU", "fr": "Je me soucie beaucoup de ce qui va mal dans le monde : le crime, la pollution, etc.", "en": "I worry a lot about what's wrong in the world: crime, pollution, etc.", "ar": "أنشغل كثيرًا بما يسوء في العالم: الجريمة، التلوث، وما إلى ذلك."}, {"n": 101, "s": "VU", "fr": "J’ai souvent le sentiment que je pourrais devenir fou(folle).", "en": "I often feel that I could go crazy.", "ar": "غالبًا ما أشعر بأنني قد أفقد عقلي."}, {"n": 102, "s": "VU", "fr": "J’ai souvent l’impression que je vais avoir une crise d’angoisse.", "en": "I often feel that I am going to have a panic attack.", "ar": "غالبًا ما أشعر بأنني على وشك أن أصاب بنوبة هلع."}, {"n": 103, "s": "VU", "fr": "J'ai souvent peur d’avoir une crise cardiaque ou un cancer, même s'il y a peu de raisons médicales de s'en soucier.", "en": "I am often afraid of having a heart attack or cancer, even though there is little medical reason for concern.", "ar": "غالبًا ما أخشى الإصابة بنوبة قلبية أو سرطان، حتى لو لم يكن هناك سبب طبي وجيه للقلق."}, {"n": 104, "s": "VU", "fr": "Je pense que le monde est un endroit dangereux.", "en": "I think the world is a dangerous place.", "ar": "أعتقد أن العالم مكان خطير."}, {"n": 105, "s": "EU", "fr": "Je n’ai pas pu me séparer de ma mère ou de mon père comme semblent le faire les gens de mon âge.", "en": "I have not been able to separate from my mother or father the way people my age seem to.", "ar": "لم أتمكن من الانفصال عن أمي أو أبي كما يبدو أن أقراني يفعلون."}, {"n": 106, "s": "EU", "fr": "Mes parents et moi avons tendance à être sur-impliqués dans nos vies et nos problèmes réciproques.", "en": "My parents and I tend to be overly involved in each other's lives and problems.", "ar": "أنا ووالداي نميل إلى الانخراط المفرط في حياة بعضنا ومشاكلنا."}, {"n": 107, "s": "EU", "fr": "Il est très difficile, pour mes parents et moi-même, de garder secrets, chacun pour soi, certains détails intimes, sans nous sentir trahis ou coupables.", "en": "It is very difficult for my parents and me to keep certain intimate details private from each other without feeling betrayed or guilty.", "ar": "من الصعب جدًا عليّ وعلى والديّ أن نحتفظ كل منا لنفسه بتفاصيل حميمة معينة دون أن نشعر بالخيانة أو الذنب."}, {"n": 108, "s": "EU", "fr": "Mes parents et moi devons nous parler presque tous les jours, sinon l’un de nous se sent coupable, blessé(e), déçu(e), ou seul(e).", "en": "My parents and I have to talk to each other almost every day, otherwise one of us feels guilty, hurt, disappointed, or lonely.", "ar": "يجب أن أتحدث أنا ووالداي كل يوم تقريبًا، وإلا شعر أحدنا بالذنب أو الجرح أو خيبة الأمل أو الوحدة."}, {"n": 109, "s": "EU", "fr": "J’ai souvent l’impression de ne pas avoir une identité distincte de celle de mes parents ou de mon partenaire.", "en": "I often feel that I don't have an identity distinct from my parents or my partner.", "ar": "غالبًا ما أشعر بأنني لا أملك هوية مستقلة عن هوية والديّ أو شريكي."}, {"n": 110, "s": "EU", "fr": "J'ai souvent l'impression que mes parents vivent à travers moi -- je n'ai pas une vie qui me soit propre.", "en": "I often feel that my parents live through me -- I don't have a life of my own.", "ar": "غالبًا ما أشعر بأن والديّ يعيشان من خلالي -- ليس لدي حياة خاصة بي."}, {"n": 111, "s": "EU", "fr": "Il m’est vraiment ardu de maintenir une distance vis-à-vis des gens dont je suis intime ; il m’est difficile de me sentir une personne séparée.", "en": "It is really hard for me to maintain distance from people I am close to; it is difficult for me to feel like a separate person.", "ar": "من الصعب حقًا عليّ أن أحافظ على مسافة بيني وبين الأشخاص المقربين مني؛ من الصعب أن أشعر بأنني شخص مستقل."}, {"n": 112, "s": "EU", "fr": "Je suis tellement lié(e) à mon partenaire ou à mes parents que je ne sais pas vraiment qui je suis ou ce que je veux.", "en": "I am so bound to my partner or my parents that I don't really know who I am or what I want.", "ar": "أنا مرتبط جدًا بشريكي أو والديّ لدرجة أنني لا أعرف حقًا من أنا أو ماذا أريد."}, {"n": 113, "s": "EU", "fr": "J’éprouve des difficultés à distinguer mon point de vue ou mon opinion de ceux de mes parents ou de mon partenaire.", "en": "I have difficulty distinguishing my own point of view or opinion from that of my parents or my partner.", "ar": "أجد صعوبة في التمييز بين وجهة نظري أو رأيي وبين آراء والديّ أو شريكي."}, {"n": 114, "s": "EU", "fr": "J’ai souvent l’impression de ne pas avoir d’intimité par rapport à mes parents ou mon partenaire.", "en": "I often feel that I have no privacy from my parents or my partner.", "ar": "غالبًا ما أشعر بأنني لا أملك خصوصية عن والديّ أو شريكي."}, {"n": 115, "s": "EU", "fr": "Je sens que mes parents seraient vraiment peinés si je vivais seul(e), loin d’eux.", "en": "I feel that my parents would be really hurt if I lived alone, far from them.", "ar": "أشعر بأن والديّ سيتألمان حقًا إذا عشت وحدي، بعيدًا عنهما."}, {"n": 116, "s": "SB", "fr": "Je laisse les autres faire ce qu'ils veulent, car j'ai peur des conséquences.", "en": "I let others do what they want because I'm afraid of the consequences.", "ar": "أدع الآخرين يفعلون ما يريدون لأنني أخشى العواقب."}, {"n": 117, "s": "SB", "fr": "Je pense que si je fais ce que je veux, je cours après les problèmes.", "en": "I think that if I do what I want, I'm asking for trouble.", "ar": "أعتقد أنني إذا فعلت ما أريد، فسأجلب المشاكل لنفسي."}, {"n": 118, "s": "SB", "fr": "Je sens que je n'ai pas d'autre choix que de me soumettre aux souhaits des autres, sinon ils exerceront des représailles ou me rejetteront d'une façon ou d'une autre.", "en": "I feel I have no choice but to submit to others' wishes, or they will retaliate or reject me in some way.", "ar": "أشعر بأنه ليس لدي خيار سوى الخضوع لرغبات الآخرين، وإلا سينتقمون مني أو يرفضونني بطريقة أو بأخرى."}, {"n": 119, "s": "SB", "fr": "Dans mes relations, je laisse l'autre avoir le dessus sur moi.", "en": "In my relationships, I let the other person have the upper hand over me.", "ar": "في علاقاتي، أدع الطرف الآخر يسيطر عليّ."}, {"n": 120, "s": "SB", "fr": "Je laisse toujours les autres choisir à ma place, si bien que je ne sais pas vraiment ce que je veux moi-même.", "en": "I always let others choose for me, so much so that I don't really know what I want myself.", "ar": "أدع الآخرين دائمًا يختارون نيابة عني، لدرجة أنني لا أعرف حقًا ماذا أريد بنفسي."}, {"n": 121, "s": "SB", "fr": "J’ai le sentiment que les décisions importantes de ma vie n’étaient pas vraiment les miennes.", "en": "I feel that the important decisions in my life were not really mine.", "ar": "أشعر بأن القرارات المهمة في حياتي لم تكن قراراتي الحقيقية."}, {"n": 122, "s": "SB", "fr": "Je me soucie beaucoup de plaire aux autres, pour qu’ils ne me rejettent pas.", "en": "I worry a lot about pleasing others so they won't reject me.", "ar": "أهتم كثيرًا بإرضاء الآخرين حتى لا يرفضوني."}, {"n": 123, "s": "SB", "fr": "J'ai beaucoup de difficultés à exiger que mes droits soient respectés et que mes sentiments soient pris en compte.", "en": "I have a lot of difficulty demanding that my rights be respected and my feelings be taken into account.", "ar": "أواجه صعوبة كبيرة في المطالبة باحترام حقوقي ومراعاة مشاعري."}, {"n": 124, "s": "SB", "fr": "Plutôt que manifester ouvertement ma colère, je me venge dans des petites choses.", "en": "Rather than openly showing my anger, I get back at people through small things.", "ar": "بدلًا من إظهار غضبي علنًا، أنتقم من خلال أمور صغيرة."}, {"n": 125, "s": "SB", "fr": "Je vais tolérer beaucoup plus de choses que la plupart des gens afin d’éviter une confrontation.", "en": "I will tolerate far more than most people in order to avoid a confrontation.", "ar": "سأتحمل أمورًا أكثر بكثير من معظم الناس لتجنب المواجهة."}, {"n": 126, "s": "SS", "fr": "Je fais passer les besoins des autres avant les miens, sinon je me sens coupable.", "en": "I put others' needs before my own, otherwise I feel guilty.", "ar": "أقدم احتياجات الآخرين على احتياجاتي، وإلا شعرت بالذنب."}, {"n": 127, "s": "SS", "fr": "Je me sens coupable si je laisse tomber les autres ou si je les déçois.", "en": "I feel guilty if I let others down or disappoint them.", "ar": "أشعر بالذنب إذا خذلت الآخرين أو خيبت أملهم."}, {"n": 128, "s": "SS", "fr": "Je donne davantage aux autres que je ne reçois en retour.", "en": "I give more to others than I receive in return.", "ar": "أعطي للآخرين أكثر مما أتلقى في المقابل."}, {"n": 129, "s": "SS", "fr": "Je suis celui (celle) qui finit généralement par prendre soin des gens dont je suis proche.", "en": "I am usually the one who ends up taking care of the people I am close to.", "ar": "أنا عادة من ينتهي به الأمر بالاعتناء بالأشخاص المقربين مني."}, {"n": 130, "s": "SS", "fr": "Il n’y a presque rien que je ne puisse supporter lorsque j’aime quelqu’un.", "en": "There is almost nothing I cannot bear when I love someone.", "ar": "لا يوجد تقريبًا ما لا أستطيع تحمله عندما أحب شخصًا ما."}, {"n": 131, "s": "SS", "fr": "Je suis quelqu'un de bon car je pense aux autres plus qu'à moi-même.", "en": "I am a good person because I think of others more than myself.", "ar": "أنا شخص طيب لأنني أفكر في الآخرين أكثر من نفسي."}, {"n": 132, "s": "SS", "fr": "Au travail, je suis habituellement celui (celle) qui est volontaire pour faire des heures ou des tâches supplémentaires.", "en": "At work, I am usually the one who volunteers for extra hours or tasks.", "ar": "في العمل، أنا عادة من يتطوع للعمل ساعات أو مهام إضافية."}, {"n": 133, "s": "SS", "fr": "Même si je suis très occupé(e), je trouve toujours du temps pour les autres.", "en": "Even if I am very busy, I always find time for others.", "ar": "حتى عندما أكون مشغولاً جدًا، أجد دائمًا وقتًا للآخرين."}, {"n": 134, "s": "SS", "fr": "Je peux m'en sortir avec vraiment très peu car mes besoins sont minimes.", "en": "I can get by with very little because my needs are minimal.", "ar": "يمكنني الاكتفاء بالقليل جدًا لأن احتياجاتي بسيطة."}, {"n": 135, "s": "SS", "fr": "Je ne suis heureux que si les gens qui m’entourent le sont aussi.", "en": "I am only happy if the people around me are happy too.", "ar": "لا أكون سعيدًا إلا إذا كان من حولي سعداء أيضًا."}, {"n": 136, "s": "SS", "fr": "Je suis tellement occupé(e) à me dévouer pour les gens qui m’importent que j’ai très peu de temps pour moi.", "en": "I am so busy devoting myself to the people who matter to me that I have very little time for myself.", "ar": "أنا مشغول جدًا بتكريس نفسي للأشخاص المهمين بالنسبة لي لدرجة أن لدي وقتًا قليلًا جدًا لنفسي."}, {"n": 137, "s": "SS", "fr": "J’ai toujours été celui (celle) qui écoute les problèmes des autres.", "en": "I have always been the one who listens to others' problems.", "ar": "لطالما كنت الشخص الذي يستمع لمشاكل الآخرين."}, {"n": 138, "s": "SS", "fr": "Je me sens plus à l’aise pour donner un cadeau que pour en recevoir un.", "en": "I feel more comfortable giving a gift than receiving one.", "ar": "أشعر بارتياح أكبر عند تقديم هدية أكثر من تلقيها."}, {"n": 139, "s": "SS", "fr": "On me voit comme quelqu'un qui en fait trop pour les autres et pas assez pour lui-même.", "en": "I am seen as someone who does too much for others and not enough for themselves.", "ar": "يُنظر إليّ كشخص يفعل الكثير من أجل الآخرين وليس بما يكفي من أجل نفسه."}, {"n": 140, "s": "SS", "fr": "Peu importe combien je donne, ce n’est jamais assez.", "en": "No matter how much I give, it's never enough.", "ar": "بغض النظر عن مقدار ما أعطيه، لا يكفي أبدًا."}, {"n": 141, "s": "SS", "fr": "Si je fais ce que je veux, je me sens vraiment mal à l’aise.", "en": "If I do what I want, I feel really uncomfortable.", "ar": "إذا فعلت ما أريد، أشعر بعدم ارتياح شديد."}, {"n": 142, "s": "SS", "fr": "Il m’est vraiment difficile de demander aux autres de se soucier de mes besoins.", "en": "It is really difficult for me to ask others to care about my needs.", "ar": "من الصعب حقًا عليّ أن أطلب من الآخرين الاهتمام باحتياجاتي."}, {"n": 143, "s": "EI", "fr": "J’ai peur de perdre le contrôle de mes actes.", "en": "I am afraid of losing control of my actions.", "ar": "أخشى أن أفقد السيطرة على تصرفاتي."}, {"n": 144, "s": "EI", "fr": "J'ai peur de faire du mal à quelqu'un, physiquement ou affectivement, si je perds tout contrôle sur ma colère.", "en": "I am afraid of hurting someone, physically or emotionally, if I lose all control over my anger.", "ar": "أخشى أن أؤذي شخصًا ما، جسديًا أو عاطفيًا، إذا فقدت السيطرة تمامًا على غضبي."}, {"n": 145, "s": "EI", "fr": "Je sens que je dois contrôler mes émotions et mes impulsions, sinon quelque chose de déplorable risque de se produire.", "en": "I feel I must control my emotions and impulses, otherwise something regrettable might happen.", "ar": "أشعر بأنه يجب أن أسيطر على مشاعري ونزواتي، وإلا فقد يحدث شيء مؤسف."}, {"n": 146, "s": "EI", "fr": "J’en arrive à accumuler en moi beaucoup de colère et de ressentiment que je n’exprime pas.", "en": "I end up bottling up a lot of anger and resentment that I don't express.", "ar": "ينتهي بي الأمر بتراكم الكثير من الغضب والاستياء بداخلي دون أن أعبر عنهما."}, {"n": 147, "s": "EI", "fr": "Je suis trop gêné(e) pour exprimer des sentiments positifs aux autres (par ex. de l’affection, de l’intérêt).", "en": "I am too embarrassed to express positive feelings to others (e.g., affection, interest).", "ar": "أشعر بحرج شديد للتعبير عن المشاعر الإيجابية تجاه الآخرين (مثل المودة أو الاهتمام)."}, {"n": 148, "s": "EI", "fr": "Je trouve embarrassant d’exprimer mes sentiments aux autres.", "en": "I find it embarrassing to express my feelings to others.", "ar": "أجد أنه من المحرج أن أعبر عن مشاعري للآخرين."}, {"n": 149, "s": "EI", "fr": "Il m’est difficile d’être chaleureux et spontané.", "en": "It is difficult for me to be warm and spontaneous.", "ar": "من الصعب عليّ أن أكون دافئًا وعفويًا."}, {"n": 150, "s": "EI", "fr": "Je me contrôle tellement bien que les autres croient que je n’ai pas d’émotions.", "en": "I control myself so well that others believe I have no emotions.", "ar": "أتحكم في نفسي بشكل جيد جدًا لدرجة أن الآخرين يعتقدون أنني لا أملك مشاعر."}, {"n": 151, "s": "EI", "fr": "Les gens me trouvent coincé(e) sur le plan émotionnel.", "en": "People find me emotionally uptight.", "ar": "يجد الناس أنني مقيد عاطفيًا."}, {"n": 152, "s": "US", "fr": "Je dois être le(la) meilleur(e) dans presque tout ce que je fais, je ne peux pas accepter d’être le(la) deuxième.", "en": "I must be the best at almost everything I do; I cannot accept being second.", "ar": "يجب أن أكون الأفضل في كل ما أفعله تقريبًا، ولا يمكنني قبول أن أكون الثاني."}, {"n": 153, "s": "US", "fr": "Je m'efforce de tout maintenir parfaitement en ordre.", "en": "I strive to keep everything perfectly in order.", "ar": "أسعى جاهدًا للحفاظ على كل شيء منظمًا تمامًا."}, {"n": 154, "s": "US", "fr": "Je dois apparaître sous mon meilleur aspect la plupart du temps.", "en": "I must appear at my best most of the time.", "ar": "يجب أن أظهر بأفضل مظهر لي معظم الوقت."}, {"n": 155, "s": "US", "fr": "Je m’efforce de faire de mon mieux ; je ne peux pas me contenter d'être « assez bien ».", "en": "I strive to do my best; I cannot settle for being 'good enough.'", "ar": "أسعى لبذل قصارى جهدي؛ لا يمكنني الاكتفاء بأن أكون \"جيدًا بما فيه الكفاية\"."}, {"n": 156, "s": "US", "fr": "J'ai tant de choses à faire qu'il ne me reste presque pas de temps pour me détendre vraiment.", "en": "I have so much to do that I have almost no time to really relax.", "ar": "لدي الكثير لأفعله لدرجة أنه لا يتبقى لي وقت للاسترخاء الحقيقي."}, {"n": 157, "s": "US", "fr": "Presque rien de ce que je fais n’est assez bien, je pourrais toujours faire mieux.", "en": "Almost nothing I do is good enough; I could always do better.", "ar": "لا شيء تقريبًا مما أفعله جيد بما فيه الكفاية، يمكنني دائمًا أن أفعل أفضل."}, {"n": 158, "s": "US", "fr": "Je dois faire face à toutes mes responsabilités.", "en": "I must meet all my responsibilities.", "ar": "يجب أن أفي بجميع مسؤولياتي."}, {"n": 159, "s": "US", "fr": "Je ressens une pression constante qui me force à faire les choses et à les réussir.", "en": "I feel constant pressure to get things done and succeed.", "ar": "أشعر بضغط مستمر يدفعني لإنجاز الأمور والنجاح فيها."}, {"n": 160, "s": "US", "fr": "Mes relations souffrent de ce que je m’impose trop de choses.", "en": "My relationships suffer because I put too much pressure on myself.", "ar": "تعاني علاقاتي لأنني أفرض على نفسي الكثير من الأمور."}, {"n": 161, "s": "US", "fr": "Je m'impose une telle pression pour bien faire que ma santé en souffre.", "en": "I put so much pressure on myself to do well that my health suffers.", "ar": "أفرض على نفسي ضغطًا كبيرًا لأداء جيد لدرجة أن صحتي تتأثر."}, {"n": 162, "s": "US", "fr": "Souvent je sacrifie plaisir et bonheur pour atteindre mes idéaux.", "en": "I often sacrifice pleasure and happiness to achieve my ideals.", "ar": "غالبًا ما أضحي بالمتعة والسعادة لتحقيق مثلي العليا."}, {"n": 163, "s": "US", "fr": "Lorsque je fais une erreur, je mérite une critique sévère.", "en": "When I make a mistake, I deserve severe criticism.", "ar": "عندما أرتكب خطأ، أستحق نقدًا قاسيًا."}, {"n": 164, "s": "US", "fr": "Je ne peux pas accepter de me dégager aisément d'une situation difficile ou de présenter des excuses pour mes erreurs.", "en": "I cannot accept easily getting out of a difficult situation or apologizing for my mistakes.", "ar": "لا يمكنني تقبل التخلص بسهولة من موقف صعب أو تقديم اعتذار عن أخطائي."}, {"n": 165, "s": "US", "fr": "Je suis quelqu'un de très compétitif.", "en": "I am a very competitive person.", "ar": "أنا شخص تنافسي للغاية."}, {"n": 166, "s": "US", "fr": "J’attache beaucoup d’importance à l’argent ou au statut social.", "en": "I place great importance on money or social status.", "ar": "أولي أهمية كبيرة للمال أو المكانة الاجتماعية."}, {"n": 167, "s": "US", "fr": "Je tiens toujours à être le meilleur dans ce que j’accomplis.", "en": "I always insist on being the best at what I do.", "ar": "أحرص دائمًا على أن أكون الأفضل فيما أنجزه."}, {"n": 168, "s": "ET", "fr": "Lorsque j’attends quelque chose des autres, j’ai beaucoup de difficulté à accepter un refus.", "en": "When I expect something from others, I have great difficulty accepting a refusal.", "ar": "عندما أتوقع شيئًا من الآخرين، أجد صعوبة كبيرة في قبول الرفض."}, {"n": 169, "s": "ET", "fr": "Je me mets souvent en colère ou je m'irrite quand je ne peux pas avoir ce que je veux.", "en": "I often get angry or irritated when I can't have what I want.", "ar": "غالبًا ما أغضب أو أنزعج عندما لا أستطيع الحصول على ما أريد."}, {"n": 170, "s": "ET", "fr": "Je suis quelqu'un de spécial et je ne devrais pas avoir à accepter les restrictions auxquelles les autres doivent se soumettre.", "en": "I am someone special and shouldn't have to accept the restrictions that others must submit to.", "ar": "أنا شخص مميز ولا ينبغي أن أضطر لقبول القيود التي يخضع لها الآخرون."}, {"n": 171, "s": "ET", "fr": "Je déteste être contraint(e) ou qu’on m’empêche de faire ce que je veux.", "en": "I hate being constrained or prevented from doing what I want.", "ar": "أكره أن أُقيَّد أو أُمنَع من فعل ما أريد."}, {"n": 172, "s": "ET", "fr": "Je crois que je n’ai pas à suivre les règles et les conventions comme les autres.", "en": "I believe I don't have to follow rules and conventions like others.", "ar": "أعتقد أنه ليس عليّ اتباع القواعد والأعراف كما يفعل الآخرون."}, {"n": 173, "s": "ET", "fr": "J’ai le sentiment que j’ai beaucoup plus à offrir que les autres.", "en": "I feel that I have much more to offer than others.", "ar": "أشعر بأن لدي الكثير لأقدمه أكثر من الآخرين."}, {"n": 174, "s": "ET", "fr": "Habituellement, je fais passer mes besoins avant ceux des autres.", "en": "I usually put my needs before those of others.", "ar": "عادة ما أقدم احتياجاتي على احتياجات الآخرين."}, {"n": 175, "s": "ET", "fr": "Je remarque souvent que l’importance accordée à mes priorités personnelles ne me laisse plus de temps pour les amis ou la famille.", "en": "I often notice that the importance I give to my personal priorities leaves me no time for friends or family.", "ar": "غالبًا ما ألاحظ أن الأهمية التي أوليها لأولوياتي الشخصية لا تترك لي وقتًا للأصدقاء أو العائلة."}, {"n": 176, "s": "ET", "fr": "Les autres me disent souvent que je contrôle trop la façon dont les choses sont faites.", "en": "Others often tell me that I control too much how things are done.", "ar": "غالبًا ما يخبرني الآخرون بأنني أتحكم بشكل مفرط في طريقة إنجاز الأمور."}, {"n": 177, "s": "ET", "fr": "Je suis très irrité lorsque les autres ne font pas ce que je leur demande.", "en": "I am very irritated when others don't do what I ask them to.", "ar": "أشعر بانزعاج شديد عندما لا يفعل الآخرون ما أطلبه منهم."}, {"n": 178, "s": "ET", "fr": "Je ne supporte pas que les autres me disent ce que je dois faire.", "en": "I cannot stand others telling me what to do.", "ar": "لا أتحمل أن يملي عليّ الآخرون ما يجب أن أفعله."}, {"n": 179, "s": "IS", "fr": "J'ai beaucoup de difficultés à m'arrêter de boire, de fumer, de trop manger ou à cesser d'autres comportements problématiques.", "en": "I have great difficulty stopping drinking, smoking, overeating, or other problematic behaviors.", "ar": "أواجه صعوبة كبيرة في التوقف عن الشرب أو التدخين أو الإفراط في الأكل أو سلوكيات إشكالية أخرى."}, {"n": 180, "s": "IS", "fr": "Il ne me semble pas possible de me discipliner pour terminer des tâches routinières ou ennuyeuses.", "en": "It doesn't seem possible for me to discipline myself to finish routine or boring tasks.", "ar": "لا يبدو ممكنًا أن أنضبط لإنهاء المهام الروتينية أو المملة."}, {"n": 181, "s": "IS", "fr": "Souvent, je me laisse aller à mes impulsions ou à exprimer des émotions qui me créent des difficultés ou blessent les autres.", "en": "I often give in to my impulses or express emotions that create difficulties for me or hurt others.", "ar": "غالبًا ما أنساق وراء نزواتي أو أعبر عن مشاعر تسبب لي مشاكل أو تؤذي الآخرين."}, {"n": 182, "s": "IS", "fr": "Si je ne peux pas atteindre un but, je suis facilement frustré(e) et j'abandonne.", "en": "If I can't reach a goal, I easily become frustrated and give up.", "ar": "إذا لم أتمكن من تحقيق هدف، أصاب بالإحباط بسهولة وأستسلم."}, {"n": 183, "s": "IS", "fr": "Il m’est très difficile de sacrifier une gratification immédiate pour mener à bien un projet à long terme.", "en": "It is very difficult for me to sacrifice immediate gratification to complete a long-term project.", "ar": "من الصعب جدًا عليّ التضحية بالإشباع الفوري لإنجاز مشروع طويل الأمد."}, {"n": 184, "s": "IS", "fr": "Quand je me mets en colère, il est fréquent que je ne puisse pas du tout me contrôler.", "en": "When I get angry, it's common for me to lose control entirely.", "ar": "عندما أغضب، غالبًا ما لا أستطيع السيطرة على نفسي إطلاقًا."}, {"n": 185, "s": "IS", "fr": "J'ai tendance à abuser de certaines choses, même si je sais que c’est mauvais pour moi.", "en": "I tend to overindulge in certain things, even though I know it's bad for me.", "ar": "أميل إلى الإفراط في بعض الأشياء، حتى عندما أعرف أنها ضارة بي."}, {"n": 186, "s": "IS", "fr": "Je m’ennuie très facilement.", "en": "I get bored very easily.", "ar": "أشعر بالملل بسهولة شديدة."}, {"n": 187, "s": "IS", "fr": "Quand les tâches deviennent difficiles, je ne peux souvent pas persévérer pour les terminer.", "en": "When tasks become difficult, I often cannot persevere to finish them.", "ar": "عندما تصبح المهام صعبة، غالبًا لا أستطيع المثابرة لإنهائها."}, {"n": 188, "s": "IS", "fr": "Je ne peux pas me concentrer longtemps sur quoi que ce soit.", "en": "I cannot concentrate on anything for very long.", "ar": "لا أستطيع التركيز على أي شيء لفترة طويلة."}, {"n": 189, "s": "IS", "fr": "Je ne peux pas me forcer à faire des choses qui ne me plaisent pas même quand je sais que c’est pour mon bien.", "en": "I cannot force myself to do things I don't like, even when I know it's for my own good.", "ar": "لا أستطيع إجبار نفسي على فعل أشياء لا تعجبني حتى عندما أعرف أنها لمصلحتي."}, {"n": 190, "s": "IS", "fr": "Je me mets en colère à la moindre offense.", "en": "I get angry at the slightest offense.", "ar": "أغضب لأتفه الأسباب."}, {"n": 191, "s": "IS", "fr": "J'ai rarement été capable de tenir mes engagements.", "en": "I have rarely been able to keep my commitments.", "ar": "نادرًا ما استطعت الوفاء بالتزاماتي."}, {"n": 192, "s": "IS", "fr": "Je ne peux presque jamais m’empêcher de montrer aux gens mes véritables sentiments, même si cela doit me coûter cher.", "en": "I can almost never help showing people my true feelings, even if it costs me dearly.", "ar": "لا أستطيع تقريبًا أبدًا منع نفسي من إظهار مشاعري الحقيقية للناس، حتى لو كلفني ذلك غاليًا."}, {"n": 193, "s": "IS", "fr": "J'agis souvent impulsivement et je le regrette plus tard.", "en": "I often act impulsively and regret it later.", "ar": "غالبًا ما أتصرف باندفاع وأندم على ذلك لاحقًا."}, {"n": 194, "s": "AS", "fr": "Il m’est important d’être aimé par presque tous ceux que je connais.", "en": "It is important to me to be liked by almost everyone I know.", "ar": "من المهم بالنسبة لي أن أكون محبوبًا من قبل جميع من أعرفهم تقريبًا."}, {"n": 195, "s": "AS", "fr": "Je modifie mon comportement en fonction des gens avec qui je me trouve, afin qu'ils puissent m’aimer davantage.", "en": "I change my behavior depending on who I'm with, so that they will like me more.", "ar": "أُغيّر سلوكي حسب الأشخاص الذين أكون معهم، حتى يحبوني أكثر."}, {"n": 196, "s": "AS", "fr": "Je fais tout mon possible pour m'adapter.", "en": "I do everything I can to fit in.", "ar": "أبذل كل ما بوسعي للتكيف والاندماج."}, {"n": 197, "s": "AS", "fr": "Mon estime personnelle est principalement fondée sur la façon dont les autres me voient.", "en": "My self-esteem is mainly based on how others see me.", "ar": "تقديري لذاتي يعتمد بشكل أساسي على كيفية نظرة الآخرين إليّ."}, {"n": 198, "s": "AS", "fr": "Posséder de l'argent et connaître des gens importants sont des choses qui me donnent de la valeur.", "en": "Having money and knowing important people are things that give me worth.", "ar": "امتلاك المال ومعرفة أشخاص مهمين هي أمور تمنحني قيمة."}, {"n": 199, "s": "AS", "fr": "Je consacre beaucoup de temps à soigner mon apparence afin de gagner l’estime des autres.", "en": "I spend a lot of time on my appearance to earn others' esteem.", "ar": "أخصص الكثير من الوقت للعناية بمظهري لكسب تقدير الآخرين."}, {"n": 200, "s": "AS", "fr": "Mes réussites ont plus de valeur à mes yeux si les autres les remarquent.", "en": "My achievements are worth more to me if others notice them.", "ar": "إنجازاتي لها قيمة أكبر بالنسبة لي إذا لاحظها الآخرون."}, {"n": 201, "s": "AS", "fr": "Je suis à ce point soucieux de m’adapter aux autres qu’il m’arrive de ne plus savoir qui je suis.", "en": "I am so concerned with fitting in with others that I sometimes no longer know who I am.", "ar": "أنا منشغل جدًا بالتكيف مع الآخرين لدرجة أنني أحيانًا لا أعرف من أنا."}, {"n": 202, "s": "AS", "fr": "Je trouve difficile de me fixer des objectifs propres, sans prendre en compte ce que les autres vont penser de mes choix.", "en": "I find it difficult to set my own goals without considering what others will think of my choices.", "ar": "أجد صعوبة في تحديد أهدافي الخاصة دون مراعاة ما سيفكر فيه الآخرون بشأن خياراتي."}, {"n": 203, "s": "AS", "fr": "Lorsque je considère les décisions que j'ai prises dans ma vie, je réalise que la plupart d’entre elles reposaient sur le désir d’obtenir l’approbation des autres.", "en": "When I consider the decisions I've made in my life, I realize most of them were based on wa let currentLang = 'fr';
let answersState = {};
let lastReport = null;
let confirmMissing = false;
let sentOk = false;
let sending = false;

const $ = id => document.getElementById(id);
const form = $('quizForm');
const t = key => UI[currentLang][key];

function buildForm(){
  let html = '';
  SCHEMAS.forEach(s => {
    html += `<div class="schema-block">`;
    if(SHOW_SCHEMA_TITLES){
      html += `<div class="schema-title"><span>${s[currentLang]}</span><span class="code" dir="ltr">${s.code} · ${s.lo}-${s.hi}</span></div>`;
    }
    ITEMS.filter(it => it.s === s.code).forEach(it => {
      const answered = !!answersState[it.n];
      html += `<div class="q${answered ? ' answered' : ''}" data-item="${it.n}" id="q${it.n}" role="group" aria-labelledby="qt${it.n}">
        <div class="q-text" id="qt${it.n}"><span class="q-num">${it.n}.</span>${it[currentLang]}</div>
        <div class="q-options">`;
      for(let v = 1; v <= 6; v++){
        const checked = answersState[it.n] === String(v) ? 'checked' : '';
        html += `<label title="${t('scale')[v-1]}"><input type="radio" name="item${it.n}" value="${v}" ${checked}>${v}<small>${t('scale_short')[v-1]}</small></label>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  form.innerHTML = html;
}

function renderStaticText(){
  const ui = UI[currentLang];
  document.documentElement.lang = ui.html_lang;
  document.documentElement.dir = ui.dir;
  document.title = ui.title;
  const set = (id, v, html) => { const el = $(id); if(html) el.innerHTML = v; else el.textContent = v; };
  set('txt-eyebrow', ui.eyebrow);
  set('txt-title', ui.title);
  set('txt-subtitle', ui.subtitle, true);
  set('txt-cabinet', CABINET[currentLang], true);
  set('txt-instructions-h2', ui.instructions_h2);
  set('txt-instructions-p', ui.instructions_p);
  set('txt-id-title', ui.id_title);
  set('txt-id-intro', ui.id_intro);
  set('lbl-last', ui.names[0] + ' *');
  set('lbl-first', ui.names[1] + ' *');
  set('lbl-birth', ui.names[2] + ' *');
  set('lbl-reason', ui.names[4] + ' *');
  set('lbl-patient-email', ui.names[3] + ' *');
  $('patientReason').placeholder = ui.reason_ph;
  set('startBtn', ui.start_btn);
  $('idNote').textContent = '';
  set('txt-consent', ui.consent);
  set('computeBtn', confirmMissing ? ui.confirm_btn : ui.compute_btn);
  set('jumpBtn', ui.jump_btn);
  set('txt-results-title', ui.results_title);
  set('retryBtn', ui.retry_btn);
  set('mailtoBtn', ui.mailto_btn);
  set('restartBtn', ui.restart_btn);
  set('txt-footer', ui.footer, true);
  $('scaleLegend').innerHTML = ui.scale.map((l,i) => `<div><b>${i+1}</b>${l}</div>`).join('');
  $('scaleSticky').innerHTML = ui.scale_short.map((l,i) => `<div class="chip"><b>${i+1}</b><span>${l}</span></div>`).join('');
  syncSticky();
  updateProgress();
  updateMissingNote();
}

// Hauteur réelle de l'en-tête fixe : sert au défilement automatique (l'item ne passe jamais dessous)
function syncSticky(){
  const h = $('progress-bar-outer').offsetHeight;
  document.documentElement.style.setProperty('--sticky-h', h + 'px');
}
window.addEventListener('resize', syncSticky);
window.addEventListener('load', syncSticky);
if(window.ResizeObserver) new ResizeObserver(syncSticky).observe($('progress-bar-outer'));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncSticky);

function updateProgress(){
  const answered = Object.keys(answersState).length;
  $('progressFill').style.width = (answered / ITEMS.length * 100) + '%';
  $('progressLabel').textContent = answered + t('progress_label');
}

function missingItems(){ return ITEMS.filter(it => !answersState[it.n]).map(it => it.n); }

function updateMissingNote(){
  const note = $('missingNote'), jump = $('jumpBtn');
  if(!confirmMissing){ note.textContent = ''; jump.style.display = 'none'; return; }
  const miss = missingItems();
  note.textContent = t('missing_note_tpl').replace('{miss}', miss.length).replace('{first}', miss[0]);
  jump.style.display = 'inline-block';
}

function markMissing(on){
  form.querySelectorAll('.q').forEach(q => {
    q.classList.toggle('missing', on && !answersState[q.dataset.item]);
  });
}

function goTo(el){ if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

// ----------------------------------------------------------------------------
// Identification obligatoire avant d'accéder aux questions
// ----------------------------------------------------------------------------
let started = false;
const readId = () => ({
  last: $('patientLast').value.trim(), first: $('patientFirst').value.trim(),
  birth: $('patientBirth').value, reason: $('patientReason').value.trim(),
  email: $('patientEmail').value.trim()
});
const fmtBirth = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
function ageAt(iso){
  const b = new Date(iso + 'T00:00:00'), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
$('patientBirth').max = new Date().toISOString().slice(0, 10);

$('startBtn').addEventListener('click', () => {
  const ui = UI[currentLang];
  const v = readId();
  const ids = ['patientLast', 'patientFirst', 'patientBirth', 'patientEmail', 'patientReason'];
  const vals = [v.last, v.first, v.birth, v.email, v.reason];
  const missing = [];
  ids.forEach((id, i) => { const bad = !vals[i]; $(id).classList.toggle('invalid', bad); if(bad) missing.push(i); });
  const note = $('idNote');
  if(missing.length){
    note.textContent = ui.err_required + ' ' + missing.map(i => ui.names[i]).join(', ') + '.';
    $(ids[missing[0]]).focus();
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  if(isNaN(new Date(v.birth + 'T00:00:00')) || v.birth > today || v.birth < '1900-01-01'){
    $('patientBirth').classList.add('invalid');
    note.textContent = ui.err_birth; $('patientBirth').focus(); return;
  }
  if(!$('patientEmail').checkValidity()){
    $('patientEmail').classList.add('invalid');
    note.textContent = ui.err_email; $('patientEmail').focus(); return;
  }
  note.textContent = '';
  started = true;
  $('idCard').style.display = 'none';
  $('quizArea').style.display = 'block';
  $('progress-bar-outer').style.display = '';
  syncSticky();
  setTimeout(() => goTo($('q1')), 60);
});
['patientLast', 'patientFirst', 'patientBirth', 'patientEmail', 'patientReason'].forEach(id =>
  $(id).addEventListener('input', () => $(id).classList.remove('invalid')));

// Choix d'une réponse (un seul gestionnaire : l'item concerné est toujours celui qui a été cliqué)
form.addEventListener('change', (e) => {
  const input = e.target;
  if(!input || !input.name || !input.name.startsWith('item')) return;
  const n = input.name.replace('item', '');
  const wasNew = !answersState[n];
  answersState[n] = input.value;
  const q = $('q' + n);
  q.classList.add('answered'); q.classList.remove('missing');
  confirmMissing = confirmMissing && missingItems().length > 0;
  if(!confirmMissing){ $('computeBtn').textContent = t('compute_btn'); }
  updateProgress(); updateMissingNote();
  if(wasNew){
    const next = $('q' + (parseInt(n, 10) + 1));
    if(next) setTimeout(() => goTo(next), 200);
  }
});

$('jumpBtn').addEventListener('click', () => {
  const m = missingItems();
  if(m.length) goTo($('q' + m[0]));
});

// ----------------------------------------------------------------------------
// Cotation (identique au classeur source) : score d'un schéma = somme des
// réponses cotées 4, 5 ou 6 (les réponses 1 à 3 comptent pour 0).
// ----------------------------------------------------------------------------
function computeResults(){
  const results = SCHEMAS.map(s => {
    let total = 0, marked = 0, answered = 0;
    for(let n = s.lo; n <= s.hi; n++){
      const a = answersState[n] ? parseInt(answersState[n], 10) : null;
      if(a !== null) answered++;
      if(a !== null && a >= 4 && a <= 6){ total += a; marked++; }
    }
    return { ...s, total_score: total, marked, answered, pct: total / s.max };
  });
  const byCode = Object.fromEntries(results.map(r => [r.code, r]));
  const domains = DOMAINS.map(d => {
    const list = d.schemas.map(c => byCode[c]);
    const score = list.reduce((a, r) => a + r.total_score, 0);
    const max = list.reduce((a, r) => a + r.max, 0);
    return { ...d, list, score, max, pct: score / max };
  });
  return { results, domains };
}

const pctStr = p => Math.round(p * 100) + '%';

// Rapport e-mail (toujours en français pour le praticien) : identification + scores par domaine et par schéma
function buildReport(){
  const { domains } = computeResults();
  const id = readId();
  const name = `${id.last.toUpperCase()} ${id.first}`;
  const birthStr = fmtBirth(id.birth);
  const age = ageAt(id.birth);
  const dateStr = new Date().toLocaleDateString('fr-FR');
  const miss = missingItems();

  const L = [];
  L.push('YSQ-L3 — RÉSULTATS');
  L.push(CABINET_FR);
  L.push(`Examinateur : ${EXAMINER}, ${EXAMINER_TITLE_FR}`);
  L.push('');
  L.push('IDENTIFICATION DU PATIENT');
  L.push(`Nom : ${id.last.toUpperCase()}`);
  L.push(`Prénom : ${id.first}`);
  L.push(`Date de naissance : ${birthStr} (${age} ans)`);
  L.push(`E-mail : ${id.email}`);
  L.push(`Motif de l'évaluation : ${id.reason}`);
  L.push(`Date de passation : ${dateStr}`);
  L.push('');
  L.push('SCORES PAR DOMAINE ET PAR SCHÉMA (score / maximum — pourcentage)');
  domains.forEach(d => {
    L.push('');
    L.push(`DOMAINE ${d.n} — ${d.fr} : ${d.score}/${d.max} (${pctStr(d.pct)})`);
    d.list.forEach(r => L.push(`  ${r.code} — ${r.fr} : ${r.total_score}/${r.max} (${pctStr(r.pct)})`));
  });
  if(miss.length){
    L.push('');
    L.push(`Items sans réponse (comptés pour 0) : ${miss.join(', ')}`);
  }
  const text = L.join('\n');

  const fields = { '_subject': `YSQ-L3 — ${name} — ${dateStr}`, '_template': 'table', '_captcha': 'false' };
  if(id.email) fields['_replyto'] = id.email;
  fields['YSQ-L3'] = text;

  return { fields, text, short: text, name, dateStr };
}

// ----------------------------------------------------------------------------
// Envoi
// ----------------------------------------------------------------------------
function setStatus(msg, cls){ const el = $('sendStatus'); el.textContent = msg; el.className = 'send-status ' + (cls || ''); }

async function sendReport(){
  if(sending || sentOk || !lastReport) return;
  sending = true;
  $('fallbackZone').style.display = 'none';
  setStatus(t('sending'), 'pending');
  $('sendDetail').textContent = '';
  try {
    let url = SEND_ENDPOINT, body = lastReport.fields;
    if(WEB3FORMS_KEY){
      url = 'https://api.web3forms.com/submit';
      body = { access_key: WEB3FORMS_KEY, subject: lastReport.fields['_subject'],
               from_name: 'YSQ-L3 — ' + CABINET_FR, message: lastReport.text };
      if(lastReport.fields['_replyto']) body.replyto = lastReport.fields['_replyto'];
    }
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch(e){}
    if(!res.ok || !(data.success === true || data.success === 'true')) throw new Error('HTTP ' + res.status + (data.message ? ' — ' + data.message : ' — réponse inattendue du service d\'envoi'));
    sentOk = true;
    setStatus(t('send_ok'), 'ok');
  } catch(err){
    console.error('Envoi e-mail :', err);
    $('sendDetail').textContent = 'Détail technique : ' + (err && err.message ? err.message : err);
    setStatus(t('send_err'), 'err');
    $('mailtoBtn').href = 'mailto:' + PRACTITIONER_EMAIL + '?subject=' + encodeURIComponent('YSQ-L3 — ' + lastReport.name + ' — ' + lastReport.dateStr) + '&body=' + encodeURIComponent(lastReport.short);
    $('fallbackZone').style.display = 'block';
  } finally {
    sending = false;
  }
}

$('computeBtn').addEventListener('click', () => {
  const miss = missingItems();
  if(miss.length > 0 && !confirmMissing){
    confirmMissing = true;
    $('computeBtn').textContent = t('confirm_btn');
    markMissing(true);
    updateMissingNote();
    goTo($('q' + miss[0]));
    return;
  }
  lastReport = buildReport();
  sentOk = false;
  $('computeBtn').disabled = true;
  $('results').style.display = 'block';
  $('results').scrollIntoView({ behavior: 'smooth' });
  sendReport();
});

$('retryBtn').addEventListener('click', sendReport);

$('restartBtn').addEventListener('click', () => {
  answersState = {}; lastReport = null; confirmMissing = false; sentOk = false;
  buildForm();
  updateProgress();
  $('results').style.display = 'none';
  $('missingNote').textContent = ''; $('jumpBtn').style.display = 'none';
  setStatus('', ''); $('fallbackZone').style.display = 'none';
  $('computeBtn').disabled = false;
  $('computeBtn').textContent = t('compute_btn');
  started = false;
  $('quizArea').style.display = 'none';
  $('progress-bar-outer').style.display = 'none';
  $('idCard').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Sélecteur de langue (mémorisé si possible) — les réponses sont conservées
function setLang(lang){
  currentLang = lang;
  try { localStorage.setItem('ysq_lang', lang); } catch(e){}
  document.querySelectorAll('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderStaticText();
  buildForm();
  if(confirmMissing) markMissing(true);
}
document.querySelectorAll('#langSwitch button').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));

let startLang = 'fr';
try {
  const saved = localStorage.getItem('ysq_lang');
  if(saved && UI[saved]) startLang = saved;
  else if((navigator.language || '').toLowerCase().startsWith('ar')) startLang = 'ar';
  else if((navigator.language || '').toLowerCase().startsWith('en')) startLang = 'en';
} catch(e){}
setLang(startLang);
